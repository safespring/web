explanation_2 = "Begrepet 404 er vanlig og i overført betydning kan det noen ganger brukes i stedet for \"finnes ikke\" eller \"feil\", mest i tekniske sammenhenger."
explanation_3 = "Feilkoden 404 må ikke forveksles med \"server ikke funnet\", \"server krasjet\" eller lignende feil."

