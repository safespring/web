heading = "Siden du ser etter ser ikke ut til å finnes"
body = "Dette kan skyldes en feil lenke. Hvis siden har blitt flyttet eller fjernet, kan det hende at den gamle lenken har sluttet å virke og sender deg hit i stedet. Kontakt oss hvis du mener at denne siden fortsatt burde finnas under denne lenken."
page_tried = "Siden du prøvde å nå"
what_means = "Hva betyr 404?"
