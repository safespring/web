#------------------------------------------------------------------------------
# Content mounts
#------------------------------------------------------------------------------

# SV content
[[module.mounts]]
source = 'content/sv'
target = 'content'
  [module.mounts.sites.matrix]
  languages = ['sv']

# NB content
[[module.mounts]]
source = 'content/nb'
target = 'content'
  [module.mounts.sites.matrix]
  languages = ['nb']

# DA content
[[module.mounts]]
source = 'content/da'
target = 'content'
  [module.mounts.sites.matrix]
  languages = ['da']

# EN content
[[module.mounts]]
source = 'content/en'
target = 'content'
  [module.mounts.sites.matrix]
  languages = ['en']

# English compliance documents rendered for every language.
[[module.mounts]]
source = 'content/compliance'
target = 'content/compliance'
  [module.mounts.sites.matrix]
  languages = ['sv']

[[module.mounts]]
source = 'content/compliance'
target = 'content/compliance'
  [module.mounts.sites.matrix]
  languages = ['en']

[[module.mounts]]
source = 'content/compliance'
target = 'content/compliance'
  [module.mounts.sites.matrix]
  languages = ['nb']

[[module.mounts]]
source = 'content/compliance'
target = 'content/compliance'
  [module.mounts.sites.matrix]
  languages = ['da']



[params]

  mainSections = ['blog', 'tech-update', 'webinar', 'whitepaper', 'solution-brief']

[taxonomies]
  tag = 'tags'

[sitemap]
    filename = "sitemap.xml"

[outputs]
    home = ["HTML", "RSS", "LLMS"]

[services]
  [services.rss]
    limit = 50

[outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputFormats.PRINT]
    mediaType = "text/html"
    baseName = "pdf"
    isPlainText = false
    notAlternative = true

[markup]
  [markup.highlight]
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'igor'
    tabWidth = 4
  [markup.goldmark.renderer]
    hardWraps = false
    unsafe = true
    xhtml = false
  [markup.goldmark.parser]
    autoIDType = 'github-ascii'
  [markup.goldmark.extensions]
    footnote = true

[blackfriday]
fractions = false

[minify]
  minifyOutput = true
