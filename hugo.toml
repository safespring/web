baseURL = "https://beta.safespring.eu/"
author = "Safespring"
copyright = "2025 Safespring"
refLinksErrorLevel = 'warning'
removePathAccents = true
enableGitInfo = true
enableRobotsTXT = true

# Pagination
[pagination]
  pagerSize = 10
  path = "latest"

[frontmatter]
  lastmod = ['lastmod', 'modified', ':git', 'date', 'publishdate', 'pubdate', 'published']

