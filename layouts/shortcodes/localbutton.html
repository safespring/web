{{ $href := .Get "link" }}
{{ with .Get "linkref" }}{{ $href = relref $.Page . }}{{ end }}
{{ $target := default "_self" (.Get "target") }}
<br>
<a href='{{ $href }}' target='{{ $target }}'{{ if eq $target "_blank" }} rel='noopener noreferrer'{{ end }} class='button'>{{ with .Get "icon" }}<i class='fa-solid {{ . }}'></i>&nbsp;&nbsp;&nbsp;{{ end }}{{ .Get "text" }}</a>
<br>
