{{ $episodeCount := 0 }}
{{ range .Pages }}
  {{ if not .IsSection }}
    {{ $episodeCount = add $episodeCount 1 }}
  {{ end }}
{{ end }}
<div class="webinar-card">
  <a href="{{ .RelPermalink }}">
    <div class="webinar-highlist-card shadow-1">
      <div class="webinar-highlist-image" style="background-image: url('{{ .Params.card }}');"></div>
      <div class="webinar-series-text-container" data-href="{{ .Permalink }}">
        <p class="episode-counter">{{ $episodeCount }} trainings</p>
        <div>
          <h2>{{ .Title }}</h2>
          <span class="text-button">Open training&nbsp;&nbsp;&nbsp;{{ partial "fa-icon.html" (dict "class" "fas fa-arrow-right" "page" .) }}</span>
        </div>
      </div>
    </div>
  </a>
</div>
