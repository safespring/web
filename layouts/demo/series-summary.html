{{ $sectionPages := .Pages }}
{{ $episodeCount := 0 }}

{{ range $sectionPages }}
  {{ if not .IsSection }}
    {{ $episodeCount = add $episodeCount 1 }}
  {{ end }}
{{ end }}
<div class="webinar-card">
  <a href="{{ .RelPermalink }}">
    <div class="webinar-highlist-card shadow-1">
      <div class="webinar-highlist-image">
        <img
          src="{{ .Params.card }}"
          {{ partial "image-dimensions.html" .Params.card | safeHTMLAttr }}
          alt=""
          loading="lazy"
          decoding="async"
        />
      </div>
      <div class="webinar-series-text-container" data-href="{{ .Permalink }}">
        <p class="episode-counter">{{ $episodeCount }} demos</p>
        <div>
          <h2>{{ .Title }}</h2>
          <span class="text-button">Se all demos&nbsp;&nbsp;&nbsp;{{ partial "fa-icon.html" (dict "class" "fas fa-arrow-right" "page" .) }}</span>
        </div>
      </div>
    </div>
  </a>
</div>
