{{ partial "head.html" . }}

<body>
  {{ partial "g-tag-manager.html" . }}
  <div class="main">
    {{ partial "header.html" . }}
    <main class="terms" aria-label="{{ .Title }}">
      {{ $data := .Data }} {{ range $key, $value := .Data.Terms }}
      <div class="term">
        <a href="{{ printf "/%s/%s/" $data.Plural ($key | urlize) | relURL }}">
          <div class="term-title">{{ $key }} ({{ len $value }}) </div>
        </a>
      </div>
      <!-- term -->
      {{ end }}
    </main>
    <!-- terms -->
    {{ partial "footer.html" . }}
  </div>
  <!-- main end -->
</body>

</html>
