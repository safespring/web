<p id="contact-form"></p>

<div>
  <h2>{{ T "form.title" }}</h2>
  <p>{{ T "form.desc" }}</p>
  <br />

  {{ partial "contact-form.html" (dict
    "page" .
    "termsText" (T "form.privacy")
    "termsUrl" (relref . "/compliance/privacy_policy.md")
    "submit" (T "form.submit")
    "acceptAlert" (T "form.not_accepted")
    "successUrl" "/contact-thanks/"
  ) }}
</div>
