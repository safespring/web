{{- $page := .page -}}
{{- $class := .class | default "" -}}
{{- $icon := partial "fa-icon-data.html" (dict "class" $class) -}}
{{- if $page -}}
  {{- $page.Scratch.SetInMap "faIcons" $icon.symbol $icon -}}
  {{- $page.Scratch.Add "faIconOrder" (slice $icon.symbol) -}}
{{- end -}}
{{- return $icon -}}
