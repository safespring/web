baseURL = "https://www.safespring.com/"
languageCode = "sv"
title = "Empowering European Innovation"
author = "Safespring"
copyright = "2025 Safespring"
enableGitInfo = false # Production Git 1.8.3.1 cannot serve Hugo's GitInfo calls.
paginate = 10
paginatePath = "page" # Preserve the effective Hugo 0.111.3 production URLs.

# Use Git dates explicitly in the compliance component without changing other pages.
[frontmatter]
  lastmod = ["lastmod", "date", "publishDate"]

[params]
  mainSections = ['blogg', 'webinar', 'whitepaper', 'solution-brief']

[sitemap]
    changefreq = "daily"
    filename = "sitemap.xml"
    priority = 0.5

[outputs]
    home = ["HTML", "RSS"]

[outputFormats.PRINT]
    mediaType = "text/html"
    baseName = "print"
    isPlainText = false
    notAlternative = true

[markup]
  [markup.highlight]
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'igor'
    tabWidth = 4
  [markup.goldmark.renderer]
    hardWraps = false
    unsafe = true
    xhtml = false
  [markup.goldmark.extensions]
    footnote = true

[blackfriday]
fractions = false

[minify]
  minifyOutput = true
