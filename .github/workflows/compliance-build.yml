name: Compliance build

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site and compliance PDFs
        env:
          COMPLIANCE_BASE_URL: http://127.0.0.1:1324
          SKIP_NPM_CI: "1"
          SKIP_PLAYWRIGHT_INSTALL: "1"
        run: npm run build -- --noBuildLock --destination /tmp/safespring-ci-build --cleanDestinationDir --minify

      - name: Run crawler unit tests
        run: python3 -m unittest tests/test_crawl_hugo.py
